<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chroma-transparent</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>chroma-transparent</h1>
        <nav>
            <a href="/api/docs" target="_blank">API Docs</a>
        </nav>
    </header>

    <main>
        <section class="upload-section">
            <div class="dropzone" id="dropzone">
                <div class="dropzone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p>ここに画像をドロップ</p>
                    <p class="hint">または <label for="file-input" class="file-label">ファイルを選択</label></p>
                    <input type="file" id="file-input" accept="image/*" hidden>
                </div>
            </div>
        </section>

        <section class="preview-section" id="preview-section" hidden>
            <div class="preview-container">
                <div class="preview-panel">
                    <h3>元画像</h3>
                    <div class="image-wrapper checkerboard">
                        <img id="original-image" alt="Original">
                    </div>
                </div>
                <div class="preview-panel">
                    <h3>プレビュー</h3>
                    <div class="image-wrapper checkerboard">
                        <img id="preview-image" alt="Preview">
                        <div class="loading-overlay" id="loading-overlay" hidden>
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="controls-section" id="controls-section" hidden>
            <h3>パラメータ</h3>
            
            <div class="control-group">
                <label for="color-select">クロマキー色</label>
                <div class="color-input-group">
                    <select id="color-select">
                        <option value="lime" selected>lime (明るい緑)</option>
                        <option value="green">green (暗い緑)</option>
                        <option value="blue">blue (青)</option>
                        <option value="magenta">magenta (マゼンタ)</option>
                        <option value="cyan">cyan (シアン)</option>
                        <option value="red">red (赤)</option>
                        <option value="yellow">yellow (黄)</option>
                        <option value="custom">カスタム...</option>
                    </select>
                    <input type="text" id="color-custom" placeholder="#00FF00" hidden>
                    <div class="color-preview" id="color-preview"></div>
                </div>
            </div>

            <div class="control-group">
                <label for="tolerance">許容範囲: <span id="tolerance-value">0.30</span></label>
                <input type="range" id="tolerance" min="0" max="1" step="0.01" value="0.3">
            </div>

            <div class="control-group">
                <label for="feather">フェザリング: <span id="feather-value">5</span></label>
                <input type="range" id="feather" min="0" max="50" step="1" value="5">
            </div>

            <div class="control-group">
                <label for="despill">デスピル: <span id="despill-value">0.70</span></label>
                <input type="range" id="despill" min="0" max="1" step="0.01" value="0.7">
            </div>

            <div class="control-group">
                <label for="erode">収縮: <span id="erode-value">0</span></label>
                <input type="range" id="erode" min="0" max="10" step="1" value="0">
            </div>

            <div class="control-group">
                <label for="dilate">膨張: <span id="dilate-value">1</span></label>
                <input type="range" id="dilate" min="0" max="10" step="1" value="1">
            </div>

            <div class="action-buttons">
                <button id="reset-btn" class="btn btn-secondary">リセット</button>
                <button id="process-btn" class="btn btn-primary">処理してダウンロード</button>
            </div>
        </section>
    </main>

    <footer>
        <p>chroma-transparent v<span id="version">-</span></p>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
