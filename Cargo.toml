[package]
name = "chroma-transparent"
version = "0.1.0"
edition = "2021"
authors = ["aofusa"]
description = "指定した色をクロマキー処理して透過PNGに変換するCLIツール"
license = "Apache-2.0"
keywords = ["chroma-key", "transparent", "image", "png", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[features]
default = []
video = ["dep:tempfile"]
server = [
    "dep:warp",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:chrono",
    "dep:futures",
    "dep:bytes",
    "dep:tempfile",
]
full = ["video", "server"]

[dependencies]
image = "0.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"

# 動画機能用の依存関係 (feature = "video")
tempfile = { version = "3", optional = true }

# サーバ機能用の依存関係 (feature = "server")
warp = { version = "0.3", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
chrono = { version = "0.4", optional = true }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }

# アロケータ (macOS, FreeBSD以外で使用)
[target.'cfg(not(any(target_os = "macos", target_os = "freebsd")))'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
tempfile = "3"
