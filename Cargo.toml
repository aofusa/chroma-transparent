[package]
name = "chroma-transparent"
version = "0.1.0"
edition = "2021"
authors = ["aofusa"]
description = "指定した色をクロマキー処理して透過PNGに変換するCLIツール"
license = "Apache-2.0"
keywords = ["chroma-key", "transparent", "image", "png", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[features]
default = []
video = ["dep:serde_json", "dep:tempfile"]

[dependencies]
image = "0.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"

# 動画機能用の依存関係 (feature = "video")
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }

# アロケータ (macOS, FreeBSD以外で使用)
[target.'cfg(not(any(target_os = "macos", target_os = "freebsd")))'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
tempfile = "3"
