<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chroma-transparent | クロマキー変換ツール (WASM版)</title>
    <meta name="description" content="グリーンバック画像をブラウザで透過PNGに変換（サーバー不要）">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <h1>chroma-transparent <span class="badge">WASM</span></h1>
            <nav>
                <span class="mode-indicator">オフラインモード</span>
            </nav>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Upload Section (初期状態) -->
            <section class="upload-section" id="upload-section">
                <div class="dropzone" id="dropzone">
                    <div class="dropzone-content">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
                            <path d="M12 3v12"/>
                            <path d="M8 7l4-4 4 4"/>
                        </svg>
                        <p>画像をドロップ、または</p>
                        <p class="hint"><label for="file-input" class="file-label">ファイルを選択</label></p>
                        <input type="file" id="file-input" accept="image/*" hidden>
                        <p class="notice">※ この版はブラウザ上で処理するため、画像はサーバーに送信されません</p>
                    </div>
                </div>
            </section>

            <!-- Editor Section (画像読み込み後) -->
            <section class="editor-section" id="editor-section" hidden>
                <!-- 比較ビューエリア -->
                <div class="compare-view" id="compare-view">
                    <!-- ツールバー -->
                    <div class="view-toolbar">
                        <div class="toolbar-left">
                            <button class="tool-btn" id="btn-zoom-out" title="縮小 (-)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6"/>
                                </svg>
                            </button>
                            <span class="zoom-level" id="zoom-level">100%</span>
                            <button class="tool-btn" id="btn-zoom-in" title="拡大 (+)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6"/><path d="M8 11h6"/>
                                </svg>
                            </button>
                            <button class="tool-btn" id="btn-zoom-fit" title="フィット (0)">FIT</button>
                            <button class="tool-btn" id="btn-zoom-100" title="100% (1)">1:1</button>
                        </div>
                        <div class="toolbar-center">
                            <div class="view-mode-switch">
                                <button class="mode-btn active" data-mode="compare" title="比較表示">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/>
                                    </svg>
                                </button>
                                <button class="mode-btn" data-mode="original" title="元画像 (Tab)">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
                                    </svg>
                                </button>
                                <button class="mode-btn" data-mode="preview" title="処理後 (Tab)">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M9 12l2 2 4-4"/>
                                    </svg>
                                </button>
                            </div>
                            
                            <!-- 背景選択 -->
                            <div class="bg-mode-switch">
                                <button class="bg-btn active" data-bg="checker" title="透過背景">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/>
                                    </svg>
                                </button>
                                <button class="bg-btn" data-bg="white" title="白背景">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10" fill="white"/>
                                    </svg>
                                </button>
                                <button class="bg-btn" data-bg="black" title="黒背景">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10" fill="black"/>
                                    </svg>
                                </button>
                                <button class="bg-btn" data-bg="custom" title="カスタム背景">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"/>
                                        <path d="M12 2a10 10 0 0 1 0 20"/>
                                    </svg>
                                </button>
                            </div>
                            <input type="color" id="bg-color-picker" value="#808080" hidden>
                        </div>
                        <div class="toolbar-right">
                            <button class="tool-btn" id="btn-reset-view" title="ビューリセット">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                    <path d="M3 3v5h5"/>
                                </svg>
                            </button>
                            <button class="tool-btn" id="btn-fullscreen" title="フルスクリーン (F)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                                    <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
                                    <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
                                    <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                                </svg>
                            </button>
                            <!-- 別の画像を選択 -->
                            <label class="tool-btn upload-btn" for="file-input-editor" title="別の画像を選択">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="17 8 12 3 7 8"/>
                                    <line x1="12" y1="3" x2="12" y2="15"/>
                                </svg>
                            </label>
                            <input type="file" id="file-input-editor" accept="image/*" hidden>
                        </div>
                    </div>

                    <!-- 画像表示エリア -->
                    <div class="image-viewport" id="image-viewport">
                        <!-- 画像コンテナ（ズーム/パン対象） -->
                        <div class="image-container" id="image-container">
                            <!-- 元画像 -->
                            <img class="layer-image original-image" id="original-image" alt="Original">
                            <!-- 処理後画像 -->
                            <img class="layer-image preview-image" id="preview-image" alt="Preview">
                        </div>
                        
                        <!-- ローディングオーバーレイ -->
                        <div class="loading-overlay" id="loading-overlay" hidden>
                            <div class="spinner"></div>
                        </div>
                        
                        <!-- 比較スライダー（viewport固定） -->
                        <div class="compare-slider" id="compare-slider">
                            <div class="slider-line"></div>
                            <div class="slider-handle">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8 5l-5 7 5 7V5z"/>
                                    <path d="M16 5l5 7-5 7V5z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- ステータスバー -->
                    <div class="status-bar">
                        <span class="status-item" id="status-filename">-</span>
                        <span class="status-item" id="status-dimensions">-</span>
                        <span class="status-item" id="status-position">-</span>
                    </div>
                </div>

                <!-- リサイズハンドル -->
                <div class="panel-resizer" id="panel-resizer">
                    <div class="resizer-handle"></div>
                </div>

                <!-- パラメータパネル -->
                <div class="params-panel" id="params-panel">
                    <div class="params-grid">
                        <div class="param-group">
                            <label for="color-select">クロマキー色</label>
                            <div class="color-input-group">
                                <select id="color-select">
                                    <option value="lime" selected>lime / 明るい緑</option>
                                    <option value="green">green / 暗い緑</option>
                                    <option value="blue">blue / 青</option>
                                    <option value="magenta">magenta / マゼンタ</option>
                                    <option value="cyan">cyan / シアン</option>
                                    <option value="red">red / 赤</option>
                                    <option value="yellow">yellow / 黄</option>
                                    <option value="custom">カスタム...</option>
                                </select>
                                <input type="text" id="color-custom" placeholder="#00FF00" hidden>
                                <!-- カラーピッカー付きプレビュー -->
                                <div class="color-preview-wrapper">
                                    <div class="color-preview" id="color-preview" title="クリックでカラーピッカー"></div>
                                    <input type="color" id="chroma-color-picker" value="#00ff00">
                                </div>
                            </div>
                        </div>

                        <div class="param-group">
                            <label for="tolerance">許容範囲 <span id="tolerance-value">0.30</span></label>
                            <input type="range" id="tolerance" min="0" max="1" step="0.01" value="0.3">
                        </div>

                        <div class="param-group">
                            <label for="feather">フェザリング <span id="feather-value">5</span></label>
                            <input type="range" id="feather" min="0" max="50" step="1" value="5">
                        </div>

                        <div class="param-group">
                            <label for="despill">デスピル <span id="despill-value">0.70</span></label>
                            <input type="range" id="despill" min="0" max="1" step="0.01" value="0.7">
                        </div>

                        <div class="param-group">
                            <label for="erode">収縮 <span id="erode-value">0</span></label>
                            <input type="range" id="erode" min="0" max="10" step="1" value="0">
                        </div>

                        <div class="param-group">
                            <label for="dilate">膨張 <span id="dilate-value">1</span></label>
                            <input type="range" id="dilate" min="0" max="10" step="1" value="1">
                        </div>

                        <!-- 色空間選択 -->
                        <div class="param-group">
                            <label for="color-space">色空間</label>
                            <select id="color-space">
                                <option value="hsv" selected>HSV</option>
                                <option value="lab">LAB</option>
                                <option value="lch">LCH</option>
                                <option value="yuv">YUV</option>
                            </select>
                        </div>

                        <!-- 多色検出セクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <input type="checkbox" id="multi-color-enabled">
                                <label for="multi-color-enabled">多色検出</label>
                                <button type="button" class="btn-add-color" id="btn-add-color">+ 色を追加</button>
                            </div>
                            <div class="multi-color-list" id="multi-color-list" hidden>
                                <!-- 動的に追加される -->
                            </div>
                        </div>

                        <!-- バイラテラルフィルタセクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <input type="checkbox" id="bilateral-enabled">
                                <label for="bilateral-enabled">バイラテラルフィルタ</label>
                            </div>
                            <div class="param-section-content" id="bilateral-params" hidden>
                                <div class="param-group">
                                    <label for="bilateral-spatial-sigma">空間シグマ <span id="bilateral-spatial-sigma-value">5.0</span></label>
                                    <input type="range" id="bilateral-spatial-sigma" min="1" max="20" step="0.1" value="5.0">
                                </div>
                                <div class="param-group">
                                    <label for="bilateral-color-sigma">色シグマ <span id="bilateral-color-sigma-value">50.0</span></label>
                                    <input type="range" id="bilateral-color-sigma" min="10" max="100" step="1" value="50.0">
                                </div>
                                <div class="param-group">
                                    <label for="bilateral-radius">半径 <span id="bilateral-radius-value">5</span></label>
                                    <input type="range" id="bilateral-radius" min="1" max="10" step="1" value="5">
                                </div>
                            </div>
                        </div>

                        <!-- マルチスケール処理セクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <input type="checkbox" id="multiscale-enabled">
                                <label for="multiscale-enabled">マルチスケール処理</label>
                            </div>
                            <div class="param-section-content" id="multiscale-params" hidden>
                                <div class="param-group">
                                    <label for="multiscale-levels">レベル数 <span id="multiscale-levels-value">3</span></label>
                                    <input type="range" id="multiscale-levels" min="1" max="5" step="1" value="3">
                                </div>
                                <div class="param-group">
                                    <label for="multiscale-scale-factor">スケール係数 <span id="multiscale-scale-factor-value">0.50</span></label>
                                    <input type="range" id="multiscale-scale-factor" min="0.25" max="0.75" step="0.05" value="0.5">
                                </div>
                            </div>
                        </div>

                        <!-- マットエッジ最適化セクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <input type="checkbox" id="edge-optimization-enabled">
                                <label for="edge-optimization-enabled">マットエッジ最適化</label>
                            </div>
                            <div class="param-section-content" id="edge-optimization-params" hidden>
                                <div class="param-group">
                                    <label for="edge-threshold">エッジ閾値 <span id="edge-threshold-value">0.10</span></label>
                                    <input type="range" id="edge-threshold" min="0" max="1" step="0.01" value="0.1">
                                </div>
                                <div class="param-group">
                                    <label for="edge-smoothness">滑らかさ <span id="edge-smoothness-value">0.50</span></label>
                                    <input type="range" id="edge-smoothness" min="0" max="1" step="0.01" value="0.5">
                                </div>
                            </div>
                        </div>

                        <!-- 影の処理セクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <input type="checkbox" id="shadow-removal-enabled">
                                <label for="shadow-removal-enabled">影の処理</label>
                            </div>
                            <div class="param-section-content" id="shadow-removal-params" hidden>
                                <div class="param-group">
                                    <label for="shadow-threshold">影閾値 <span id="shadow-threshold-value">0.30</span></label>
                                    <input type="range" id="shadow-threshold" min="0" max="1" step="0.01" value="0.3">
                                </div>
                                <div class="param-group">
                                    <label for="shadow-removal-strength">除去強度 <span id="shadow-removal-strength-value">0.70</span></label>
                                    <input type="range" id="shadow-removal-strength" min="0" max="1" step="0.01" value="0.7">
                                </div>
                            </div>
                        </div>

                        <!-- エッジシャープニングセクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <input type="checkbox" id="sharpen-enabled">
                                <label for="sharpen-enabled">エッジシャープニング</label>
                            </div>
                            <div class="param-section-content" id="sharpen-params" hidden>
                                <div class="param-group">
                                    <label for="sharpen-amount">強度 <span id="sharpen-amount-value">0.50</span></label>
                                    <input type="range" id="sharpen-amount" min="0" max="2" step="0.1" value="0.5">
                                </div>
                                <div class="param-group">
                                    <label for="sharpen-radius">半径 <span id="sharpen-radius-value">1.0</span></label>
                                    <input type="range" id="sharpen-radius" min="0.1" max="5" step="0.1" value="1.0">
                                </div>
                                <div class="param-group">
                                    <label for="sharpen-threshold">閾値 <span id="sharpen-threshold-value">0.00</span></label>
                                    <input type="range" id="sharpen-threshold" min="0" max="1" step="0.01" value="0.0">
                                </div>
                            </div>
                        </div>

                        <!-- 適応的許容範囲セクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <input type="checkbox" id="adaptive-tolerance-enabled">
                                <label for="adaptive-tolerance-enabled">適応的許容範囲</label>
                            </div>
                            <div class="param-section-content" id="adaptive-tolerance-params" hidden>
                                <div class="param-group">
                                    <label for="adaptive-tolerance-grid-w">グリッド幅 <span id="adaptive-tolerance-grid-w-value">8</span></label>
                                    <input type="range" id="adaptive-tolerance-grid-w" min="4" max="16" step="1" value="8">
                                </div>
                                <div class="param-group">
                                    <label for="adaptive-tolerance-grid-h">グリッド高さ <span id="adaptive-tolerance-grid-h-value">8</span></label>
                                    <input type="range" id="adaptive-tolerance-grid-h" min="4" max="16" step="1" value="8">
                                </div>
                                <div class="param-group">
                                    <label for="adaptive-tolerance-sensitivity">感度 <span id="adaptive-tolerance-sensitivity-value">1.00</span></label>
                                    <input type="range" id="adaptive-tolerance-sensitivity" min="0" max="2" step="0.1" value="1.0">
                                </div>
                            </div>
                        </div>

                        <!-- エッジ検出方法セクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <input type="checkbox" id="edge-optimization-enabled" checked>
                                <label for="edge-optimization-enabled">エッジ検出方法</label>
                            </div>
                            <div class="param-section-content" id="edge-detection-params">
                                <div class="param-group">
                                    <label for="edge-detection-method">検出方法</label>
                                    <select id="edge-detection-method">
                                        <option value="sobel" selected>Sobel</option>
                                        <option value="canny">Canny</option>
                                    </select>
                                </div>
                                <div class="param-group" id="canny-params">
                                    <label for="canny-low-threshold">Canny低閾値 <span id="canny-low-threshold-value">0.10</span></label>
                                    <input type="range" id="canny-low-threshold" min="0" max="1" step="0.01" value="0.1">
                                </div>
                                <div class="param-group" id="canny-params">
                                    <label for="canny-high-threshold">Canny高閾値 <span id="canny-high-threshold-value">0.30</span></label>
                                    <input type="range" id="canny-high-threshold" min="0" max="1" step="0.01" value="0.3">
                                </div>
                                <div class="param-group" id="canny-params">
                                    <label for="canny-gaussian-sigma">ガウシアンシグマ <span id="canny-gaussian-sigma-value">1.0</span></label>
                                    <input type="range" id="canny-gaussian-sigma" min="0.5" max="3" step="0.1" value="1.0">
                                </div>
                            </div>
                        </div>

                        <!-- デスピル方法セクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <label>デスピル方法</label>
                            </div>
                            <div class="param-section-content">
                                <div class="param-group">
                                    <label for="despill-method">方法</label>
                                    <select id="despill-method">
                                        <option value="basic" selected>Basic</option>
                                        <option value="advanced">Advanced (YUV)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 細線検出セクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <input type="checkbox" id="thin-line-detection-enabled">
                                <label for="thin-line-detection-enabled">細線検出（髪の毛・毛皮）</label>
                            </div>
                            <div class="param-section-content" id="thin-line-detection-params" hidden>
                                <div class="param-group">
                                    <label for="thin-line-sensitivity">感度 <span id="thin-line-sensitivity-value">0.50</span></label>
                                    <input type="range" id="thin-line-sensitivity" min="0" max="1" step="0.01" value="0.5">
                                </div>
                                <div class="param-group">
                                    <label for="thin-line-threshold">検出閾値 <span id="thin-line-threshold-value">0.30</span></label>
                                    <input type="range" id="thin-line-threshold" min="0" max="1" step="0.01" value="0.3">
                                </div>
                            </div>
                        </div>

                        <!-- 自動パラメータ推定セクション -->
                        <div class="param-section">
                            <div class="param-section-header">
                                <input type="checkbox" id="auto-params-enabled">
                                <label for="auto-params-enabled">自動パラメータ推定</label>
                            </div>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button id="reset-btn" class="btn btn-secondary">リセット</button>
                        <button id="process-btn" class="btn btn-primary">処理してダウンロード</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <p>chroma-transparent v<span id="version">-</span> (WASM)</p>
        </footer>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
